- name: configuring redis server
  hosts: redis
  become: yes
  tasks:
  - name: enabling redis 7
    command: dnf module enable redis:7 -y

  - name: install redis
    package:
      name: redis
      state: present
  - name: allow remote connecitons
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: 0.0.0.0
  - name: disable protected mode
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^#?protected-mode yes'
      line: 'protected-mode no'
  - name: enabl and start redis
    service: 
      name: redis
      state: restarted
      enabled: yes