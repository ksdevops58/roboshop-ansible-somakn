- name: configuring frontend server
  hosts: frontend
  become: yes
  tasks:
  - name: enable nginx1.26
    command: dnf module enable nginx:1.26 -y

  - name: install nginx
    dnf: 
      name: nginx
      state: present
  
  - name: start and enable nginx
    service: 
      name: nginx
      state: started
      enabled: yes
  
  - name: find all contents inside the directory
    ansible.builtin.find:
      paths: /usr/share/nginx/html
      recurse: true
      file_type: any
      hidden: true
    register: dir_contents


- name: delete the discovered content
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ dir_contents.files }}"

- name: Downloading frontend application
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
    dest: /tmp/frontend.zip

- name: unzip frontend
  unarchive:
    src: /tmp/frontend.zip
    target: /usr/share/nginx/html
    remote_src: yes

- name: copy roboshop configure
  template:
    src: roboshop.conf.j2
    dest: /etc/nginx/default.d/roboshop.conf

- name: restart the frontend
  service:
    name: nginx
    state: restarted