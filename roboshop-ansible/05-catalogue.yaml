- name: configure catalogue server
  hosts: catalogue
  become: yes
  tasks:
  - name: disable default nodejs:24
    command: dnf module disable nodejs -y
  
  - name: Enabling nodejs:24
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    dnf:
      name: nodejs
      state: present
  
  - name: create roboshop systm user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop system user"